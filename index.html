<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TravelFlow : planifie tes voyages jour par jour, avec tes étapes, ton budget et une carte." />
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TravelFlow</title>
    <!-- thème posé AVANT le chargement de React, sinon on voit un flash sombre
         au chargement quand on est en mode clair -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {
          // localStorage bloqué : on suit juste le système
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        if (theme === "light") {
          document.documentElement.classList.add("light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f6fb");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
